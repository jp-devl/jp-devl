<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">João Pedro Moreira Martins de Sousa — Desenvolvedor em formação</title>
  <desc id="cover-desc">Capa editorial em tons de cobre e pôr do sol, com monograma JP, órbitas e as áreas tecnologia, desenvolvimento e segurança da informação.</desc>

  <defs>
