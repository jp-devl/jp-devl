      <stop offset="0" stop-color="#2E251F"/>
      <stop offset="0.55" stop-color="#50352D"/>
      <stop offset="1" stop-color="#BE673E"/>
    </linearGradient>
    <radialGradient id="sunsetGlow" cx="72%" cy="52%" r="58%">
      <stop offset="0" stop-color="#EF822F" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#EF822F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CF6A3A"/>
      <stop offset="0.6" stop-color="#EF822F"/>
      <stop offset="1" stop-color="#C29070"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#background)"/>
  <rect width="1280" height="320" fill="url(#sunsetGlow)"/>

